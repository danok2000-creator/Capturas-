<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capturas · Pesca, caza y setas</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f4f1ea;--card:#fff;--tx:#1f2a24;--mut:#6b756e;--ac:#2f6b4f;--bd:#e2ddd0;--pesca:#2a78b8;--caza:#a2562b;--setas:#7a5c8f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#151a17;--card:#1e2520;--tx:#e8ece8;--mut:#9aa59d;--ac:#6fc29a;--bd:#2c352f;--pesca:#5aaae6;--caza:#d98a5c;--setas:#b394c8}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:560px;margin:0 auto;padding:0 12px 80px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 4px 8px}
h1{font-size:22px;margin:0;letter-spacing:-.5px}
button,input,select,textarea{font:inherit;color:inherit}
.btn{background:var(--ac);color:#fff;border:0;border-radius:20px;padding:8px 16px;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--tx)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px}
.tab{flex:1;white-space:nowrap;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:8px 12px;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin-bottom:12px;overflow:hidden}
.today{padding:12px 14px}
.today h2{font-size:15px;margin:0 0 6px}
.row{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-bottom:6px}
.tip{font-size:14px;margin:6px 0 0;padding:8px 10px;border-left:3px solid var(--ac);background:var(--bg);border-radius:0 8px 8px 0}
.strip{display:flex;gap:6px;align-items:flex-end;margin:10px 0 4px;min-height:60px}.strip div{flex:1;text-align:center;font-size:11px;color:var(--mut);display:flex;flex-direction:column;align-items:center;justify-content:flex-end}.strip i{display:block;width:100%;background:var(--ac);opacity:.55;border-radius:4px 4px 0 0}.strip b{color:var(--tx);font-weight:600}.wgw{overflow-x:auto;margin:6px 0}.wg{border-collapse:collapse;font-size:12px;width:100%;min-width:380px}.wg th,.wg td{padding:4px 5px;text-align:center;border:1px solid var(--card)}.wg td{min-width:38px;font-weight:600}.wg th{color:var(--mut);font-weight:500;background:var(--bg)}.wg tr>th:first-child{position:sticky;left:0;text-align:left;white-space:nowrap}.wg small{font-size:10px}
.sp{display:flex;justify-content:space-between;gap:8px;padding:6px 0;border-bottom:1px solid var(--bd);font-size:14px}.md{border:1px solid var(--bd);border-radius:10px;padding:6px 10px;font-size:13px}
.sl{font-size:12px;color:var(--mut);margin-top:6px}
.note{font-size:11px;color:var(--mut);margin-top:6px}
.ph{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:90px;background:var(--bg)}
.ph img{width:100%;height:100%;object-fit:cover}
.meta{padding:10px 14px}
.who{display:flex;align-items:center;gap:8px;padding:10px 14px;font-weight:600}
.av{width:30px;height:30px;border-radius:50%;background:var(--ac);color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px}
.badge{font-size:11px;padding:2px 8px;border-radius:10px;color:#fff;margin-left:auto}
.b-pesca{background:var(--pesca)}.b-caza{background:var(--caza)}.b-setas{background:var(--setas)}
.like{background:none;border:0;font-size:18px;cursor:pointer;padding:0}
dialog{border:0;border-radius:16px;padding:16px;width:min(92vw,420px);background:var(--card);color:var(--tx)}
dialog::backdrop{background:#0008}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 3px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
<header><h1>🎣🦌🍄 Capturas</h1><button class="btn ghost" id="me">Mi perfil</button></header>
<div class="tabs" id="tabs"></div>
<div id="today"></div>
<div id="feed"></div>
</div>
<div style="position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px))"><button class="btn" id="add" style="padding:14px 20px;box-shadow:0 4px 14px #0004">＋ Subir captura</button></div>

<dialog id="dlg"><form method="dialog" id="f">
<strong>Nueva captura</strong>
<label>Categoría</label><select id="cat"><option value="pesca">🎣 Pesca</option><option value="caza">🦌 Caza</option><option value="setas">🍄 Setas</option></select>
<label>Especie</label><input id="sp" placeholder="Lubina, corzo, boletus…" required>
<label>Peso / cantidad</label><input id="kg" placeholder="5 kg">
<label>Lugar</label><input id="pl" placeholder="Costa de Cantabria">
<label>Foto</label><input id="ph" type="file" accept="image/*">
<label>Comentario</label><textarea id="tx" rows="2"></textarea>
<div class="acts"><button type="button" class="btn ghost" id="cx">Cancelar</button><button class="btn" id="ok">Publicar</button></div>
</form></dialog>

<dialog id='fd'></dialog><dialog id="pd"><strong>Tu perfil</strong>
<label>Nombre de usuario</label><input id="un" placeholder="@tu_usuario"><div id="med"></div>
<div class="acts"><button class="btn" id="sv">Guardar</button></div></dialog>

<script>
const CATS={todo:['Todo','🌍'],pesca:['Pesca','🎣'],caza:['Caza','🦌'],setas:['Setas','🍄']};
const EMO={pesca:'🐟',caza:'🦌',setas:'🍄'};
// Datos de ejemplo. En la versión real vendrían de APIs de meteorología, mareas y calendario cinegético.
const COND={
pesca:{t:'🌬️ Viento 28 km/h',a:'🌊 Oleaje 2,0 m',b:'🌙 Marea: bajamar 17:40',tip:'Con viento y oleaje el agua va turbia: buen día para lubina y sargo (más a lanzado desde roca). Mejor el amanecer y la subida de marea.'},
caza:{t:'🌡️ 6 °C · máx 13 °C',a:'💨 Viento suave NO',b:'📅 Apertura corzo (según tu comunidad)',tip:'Con el descenso de temperaturas, el corzo tiende a subir a las zonas altas buscando hierba húmeda. Revisa la normativa de tu coto.'},
setas:{t:'🌧️ Lluvia últimos 7 días: 34 mm',a:'🌡️ Suelo 11 °C',b:'🌙 Luna menguante',tip:'Humedad y temperaturas suaves: buenas condiciones para boletus y níscalos en pinar y robledal, 5–10 días después de la lluvia.'}};
// Datos de ejemplo con la misma forma que devolvería una API real de tiempo y mareas.
const DATA={
pesca:{wind:28,gust:41,dir:'SO',wave:2.0,per:9,pres:1008,dpres:-4,tide:'Bajamar 17:40 · pleamar 23:52',coef:78,water:15.5,unit:'km/h',lab:'Viento por horas',hours:[['08h',18],['11h',22],['14h',28],['17h',31],['20h',24],['23h',16]]},
caza:{temp:6,max:13,wind:9,dir:'NO',rain:0,hum:82,pres:1021,dpres:3,moon:'Menguante 28 %',unit:'°C',lab:'Temperatura por horas',hours:[['06h',4],['09h',8],['12h',13],['15h',12],['18h',9],['21h',6]]},
setas:{rain7:34,soil:11,hum:88,tmin:5,moon:'Menguante 35 %',unit:'%',lab:'Humedad por horas',hours:[['06h',94],['09h',90],['12h',78],['15h',74],['18h',82],['21h',89]]}};
const ZONES=[['Ribadeo',15,91,1.0],['Luarca',55,87,1.1],['Gijón',130,74,1.0],['Llanes',175,80,.8],['Santander',220,76,.9],['Bermeo',270,68,1.1],['Donostia',315,62,.9]];
// [nombre, emoji, modalidades (c costa, b barco), oleaje ideal m, viento máx km/h, agua (0 clara, 1 turbia, 2 indiferente), temporada mes inicio-fin]. Valores orientativos por validar.
const SPEC=[['Lubina','🐟','cb',[1,3.5],35,1,[1,12]],['Sargo','🐟','c',[.8,3],30,1,[4,11]],['Dorada','🐠','cb',[0,1.5],20,0,[5,11]],['Mubles / lisa','🐟','c',[0,1.5],25,0,[1,12]],['Jurel / chicharro','🐟','cb',[0,2],25,0,[5,11]],['Caballa','🐟','cb',[0,2],25,0,[4,10]],['Bonito del norte','🐟','b',[0,2],25,0,[6,10]],['Anchoa','🐟','b',[0,1.5],20,0,[3,6]],['Congrio','🐍','cb',[0,3],40,2,[1,12]],['Maragota','🐟','c',[.5,2.5],30,1,[4,10]],['Breca / pagel','🐟','cb',[0,1.5],25,0,[5,11]],['Besugo','🐟','b',[0,2],30,2,[10,3]],['Merluza','🐟','b',[0,2.5],35,2,[1,12]],['Rape','🐟','b',[0,2.5],35,2,[1,12]],['Pulpo','🐙','c',[0,1],20,0,[5,10]],['Calamar / chipirón','🦑','cb',[0,1.5],20,0,[9,3]],['Sepia','🦑','c',[0,1],20,0,[3,7]],['Rodaballo','🐟','b',[0,2],30,2,[1,12]],['Lenguado','🐟','c',[0,1.5],25,1,[1,12]],['Cabracho','🐟','b',[0,2.5],35,2,[1,12]],['Palometa','🐟','cb',[0,1.5],25,0,[6,10]],['Serviola','🐟','b',[0,2],25,0,[6,10]]];
let ZI=4,MODE='all';
const ZN=()=>({e:ZONES[ZI][3],n:ZONES[ZI][0]});
function zd(){if(LIVE)return {...DATA.pesca,...LIVE.now};const d=DATA.pesca,e=ZN().e,f=.8+.2*e;return {...d,wave:+(d.wave*e).toFixed(1),wind:Math.round(d.wind*f),gust:Math.round(d.gust*f)}}
function setZone(i){ZI=i;render();loadLive()}function setMode(m){MODE=m;render()}
function zoneUI(){return `<div class="card today"><h2>📍 Tu zona: ${ZONES[ZI][0]}</h2><svg viewBox="0 0 330 110" style="width:100%"><polygon points="0,110 0,92 40,88 80,84 130,74 175,80 220,76 270,68 330,60 330,110" style="fill:var(--bd)"/>${ZONES.map(([n,x,y],i)=>`<g onclick="setZone(${i})" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="15" fill="transparent"/><circle cx="${x}" cy="${y}" r="${i===ZI?8:6}" style="fill:${i===ZI?'var(--ac)':'var(--pesca)'}"/><text x="${x}" y="${y-12}" font-size="9" text-anchor="middle" fill="currentColor">${n}</text></g>`).join('')}</svg><div class="note">${LSTAT}. Mapa esquemático del Cantábrico, de oeste a este. Toca un punto para cambiar de zona.</div></div>`}
function specUI(){const d=zd(),m=new Date().getMonth()+1,tb=d.wave>=1.5||d.wind>=25?1:0;
const L=SPEC.filter(s=>MODE==='all'||s[2].includes(MODE==='costa'?'c':'b')).map(s=>{let sc=5,w=[];const[a,b]=s[6],ok=a<=b?m>=a&&m<=b:m>=a||m<=b;
if(!ok){sc=0;w.push('fuera de temporada')}else{if(d.wave<s[3][0]||d.wave>s[3][1]){sc-=2;w.push('oleaje fuera de rango')}if(d.wind>s[4]){sc--;w.push('viento alto')}if(s[5]!==2&&s[5]!==tb){sc--;w.push('agua '+(tb?'turbia':'clara')+' poco ideal')}if(MODE==='barco'&&d.wave>2.5){sc-=2;w.push('mar peligroso para salir')}}
return [s,Math.max(0,sc),w]}).sort((x,y)=>y[1]-x[1]);
return `<div class="card today"><h2>🐟 Qué pescar hoy en ${ZONES[ZI][0]}</h2><div class="tabs">${[['all','Todas'],['costa','Costa'],['barco','Barco']].map(([k,n])=>`<button class="tab ${MODE===k?'on':''}" onclick="setMode('${k}')">${n}</button>`).join('')}</div><div style="max-height:340px;overflow:auto">${L.map(([s,sc,w])=>`<div class="sp"><span>${s[1]} ${s[0]}<br><small class="sl">${w.join(', ')||'condiciones favorables'}</small></span><span style="color:var(--ac)">${'★'.repeat(sc)}${'☆'.repeat(5-sc)}</span></div>`).join('')}</div><div class="note">Rangos y temporadas orientativos, pendientes de validar. Respeta vedas y tallas mínimas.</div></div>`}
function chart(l,v,u){const w=300,h=64,mx=Math.max(...v),mn=Math.min(...v),r=(mx-mn)||1,P=v.map((y,i)=>[10+i*(w-20)/(v.length-1),h-8-(y-mn)/r*(h-22)]);return `<div class="sl">${l} (${u}) · mín ${mn} · máx ${mx}</div><svg viewBox="0 0 ${w} ${h}" style="width:100%"><polyline points="${P.map(p=>p.join(',')).join(' ')}" fill="none" style="stroke:var(--ac)" stroke-width="2.5"/>${P.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="3" style="fill:var(--ac)"/>`).join('')}</svg>`}
function charts(){return chart('Marea',[1.1,0.5,0.3,0.9,1.9,2.6,2.2,1.4],'m')+chart('Presión',[1011,1010,1009,1008,1008,1009,1010,1011],'hPa')+chart('Oleaje',[1.2,1.6,2.0,2.2,1.9,1.5,1.2,1.0].map(x=>+(x*ZN().e).toFixed(1)),'m')}
function medals(){const P=S.posts,n=P.length,kg=P.map(p=>parseFloat(String(p.kg).replace(',','.'))||0),pd={};P.forEach(p=>{const d=new Date(p.id).toDateString();pd[d]=(pd[d]||0)+1});const u=f=>new Set(P.map(f)).size;
const M=[['🥇','Primera captura',n>=1],['🐟','Pez gordo (5 kg o más)',Math.max(0,...kg)>=5],['🏆','Gigante (10 kg o más)',Math.max(0,...kg)>=10],['🔥','Día de oro (5 en un día)',Math.max(0,...Object.values(pd))>=5],['📅','Regular (3 días distintos)',Object.keys(pd).length>=3],['🧬','Coleccionista (5 especies)',u(p=>p.sp.toLowerCase())>=5],['🧭','Explorador (3 lugares)',u(p=>p.pl.toLowerCase())>=3],['🎣','Polivalente (pesca, caza y setas)',u(p=>p.c)>=3],['⭐','Veterano (25 capturas)',n>=25]];
const pts=M.filter(m=>m[2]).length*10+n*2;return `<div class="sl">Medallas · ${pts} puntos</div><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px">${M.map(([e,t,ok])=>`<span class="md" style="opacity:${ok?1:.35}">${e} ${t}</span>`).join('')}</div>`}
const REN={'Calamar / chipirón':'Txipirón','Breca / pagel':'Breca'};SPEC.forEach(s=>{if(REN[s[0]])s[0]=REN[s[0]]});SPEC.find(s=>s[0]==='Breca')[2]='b';
const RAIN=2.2,TIDE=['11:27','23:52'];
function moon(){const jd=Date.now()/864e5+2440587.5,age=(((jd-2451550.1)%29.530588)+29.530588)%29.530588,pct=Math.round((1-Math.cos(2*Math.PI*age/29.530588))/2*100);let n,f='otra';if(age<2||age>27.5){n='Luna nueva';f='nueva'}else if(age<6.4)n='Creciente';else if(age<8.4){n='Cuarto creciente';f='cuarto'}else if(age<13.4)n='Gibosa creciente';else if(age<16.4){n='Luna llena';f='llena'}else if(age<21)n='Gibosa menguante';else if(age<23.5){n='Cuarto menguante';f='cuarto'}else n='Menguante';return{age,pct,n,f}}
function moonTxt(){const m=moon();return m.n+' '+m.pct+' %'}
DATA.caza.moon=moonTxt();DATA.setas.moon=moonTxt();
function win(t,a,b){const[h,m]=t.split(':').map(Number),c=h*60+m,f=x=>{x=((x%1440)+1440)%1440;return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')};return f(c+a)+' a '+f(c+b)}
// Parámetros de puntuación (ola m, viento km/h, sw mar de fondo m, tu 0 clara 1 turbia 2 da igual, tmp agua °C, luna fases, mar ventana minutos respecto a pleamar)
const PAR={'Bonito del norte':{ola:[0,2],vi:25,sw:2,tu:0,tmp:[16,20],se:[6,10]},'Txipirón':{ola:[0,1],vi:15,sw:1,tu:0,rain:8,luna:['llena'],mar:[-120,60],se:[1,12]},'Lubina':{ola:[1,3],vi:40,sw:3,tu:1,luna:['nueva','llena'],se:[1,12]},'Sargo':{ola:[.8,3],vi:35,swmin:1,tu:1,luna:['nueva','llena'],se:[1,12]},'Dorada':{ola:[0,1.2],vi:20,sw:1.2,tu:0,tmp:[18,22],luna:['nueva','llena'],mar:[-120,60],se:[5,11]},'Breca':{ola:[0,1.5],vi:20,sw:1.5,tu:0,mar:[-120,60],se:[1,12]}};
function sc2(s){const d=zd(),P=PAR[s[0]]||{},ola=P.ola||s[3],vi=P.vi??s[4],tu=P.tu??s[5],se=P.se||s[6],sw=LIVE?LIVE.now.sw:+(1.8*ZN().e).toFixed(1),mo=moon(),m=new Date().getMonth()+1,[a,b]=se;let p=0,w=[];
if(!(a<=b?m>=a&&m<=b:m>=a||m<=b))return [0,['fuera de temporada']];
if(d.wave<ola[0]||d.wave>ola[1]){p+=2;w.push('oleaje fuera de rango')}
if(d.wind>vi){p+=1;w.push('viento alto')}
if(P.sw!=null&&sw>P.sw){p+=1;w.push('mar de fondo alto')}
if(P.swmin!=null){if(sw<P.swmin){p+=1;w.push('mar tranquilo: los grandes estarán más profundos')}else if(d.wave<=ola[1])w.push('mar de fondo en las rompientes: favorable')}
const tb=d.wave>=1.5||d.wind>=25?1:0;if(tu!==2&&tu!==tb){p+=1;w.push('agua '+(tb?'turbia':'clara')+' poco ideal')}
if(P.tmp&&(d.water<P.tmp[0]||d.water>P.tmp[1])){p+=1;w.push('agua a '+d.water+' °C (ideal '+P.tmp[0]+' a '+P.tmp[1]+')')}
if(P.luna&&!P.luna.includes(mo.f)){p+=.5;w.push('luna poco favorable')}
if(P.rain!=null&&(LIVE?LIVE.now.rain:RAIN)>P.rain){p+=1;w.push('lluvia fuerte')}
if(MODE==='barco'&&d.wave>2.5){p+=2;w.push('mar peligroso para salir')}
return [Math.max(0,Math.round(5-p)),w]}
const FICHAS={

ua preocupa a los pescadores','Se llama bonito del norte al ejemplar de más de 4 kg capturado con anzuelo','Sal temprano y busca aves y frentes','Con mar de más de 2 m, valora la seguridad']},
